[package]
name = "renderer"
version.workspace = true
edition.workspace = true

# The installed name. The crate stays `renderer`, which is what `-p renderer` and every module
# path in the tree already say; this is only what lands in `$PREFIX/lib/oblisk`.
[[bin]]
name = "oblisk-renderer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# `swash` is cosmic-text's default rasterizer and nothing here calls it. femtovg rasterizes every
# glyph this shell draws (`text/atlas.rs`'s `fill_text`), and cosmic-text is reached only from
# `text/shaping.rs` and `text/fonts.rs`, for shaping and measurement. On the defaults it pulled a
# whole second font-parsing stack alongside the `ttf-parser` one `fontdb` already brings: swash,
# skrifa, read-fonts, font-types, zeno and yazi, six crates nothing reads. 157 to 151.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
femtovg = "0.26.0"
fontdb = "0.23.0"
freedesktop-icons = "0.4.0"
glow = "0.18.0"
# femtovg declares `image` with `default-features = false` and turns no format on, so its own
# `load_image_file` answers every PNG with `Unsupported(Exact(Png))`. `image::decode_raster` calls
# the crate directly instead, and this is where the formats it accepts are named.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
cursor-icon = "1.2.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serde"] }
nix = { version = "0.31.3", features = ["poll", "time"] }
resvg = { version = "0.48.1", default-features = false }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
smithay-client-toolkit = "0.21.1"
taffy = { version = "0.14.0", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "macros", "sync", "time"] }
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"
ttf-parser = "0.25.1"
