[workspace]
members = ["shared", "supervisor", "renderer"]
resolver = "3"

# One version for the three crates. They ship together, the Supervisor spawns the Renderer as a
# sibling binary, and `shared` is only ever consumed by those two, so three numbers could differ
# only by mistake. It is also the number `obelisk --version` prints, the one `obelisk.version` hands
# a config (§ 2), and the one stamped into the generated language-server stubs, and those three
# disagreeing is exactly the failure worth designing out.
#
# Versioning tracks the Lua API, because that is the only public interface this has. Minor for an
# IDL field added or changed, patch for everything else. A config gates on it with
# `obelisk.version.minor >= n`.
#
# Not in force yet, which is why IDL changes keep landing against 0.1.0 (ADR-0069's `scroll`,
# ADR-0078's `exclusive`). Nothing has been pushed to origin, so this number informs nobody and
# 0.1.0 is a placeholder. The first push starts it; until then, do not bump, and do not re-litigate
# the gap between this comment and the log every time an IDL field moves.
[workspace.package]
version = "0.1.0"
edition = "2024"
# cosmic-text 0.19's floor.
rust-version = "1.89"

# Versions shared by more than one member; features stay per member.
[workspace.dependencies]
libc = "0.2"
nix = "0.31.3"
png = "0.18.1"
serde = "1.0.229"
serde_json = "1.0.151"
shared = { path = "shared" }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"

# Every `unsafe` block in this workspace is a real one -- a C API (EGL, GL, fontdb's mmap) or the
# one process-wide `set_var` in `main`. `undocumented_unsafe_blocks` makes the SAFETY comment a
# build requirement rather than a convention, because the convention had already drifted: two
# comments claimed no other test touched the variable they were setting while another test set it,
# which is how a `just check` failed on a race that had been latent for weeks.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# On in release, which is not the default. The Renderer does its geometry in `i32` physical pixels
# and hands the results to allocators: `layout/paint.rs`'s `draw_clipped` computes
# `(clip.x1 - clip.x0) as usize` and asks femtovg for a texture that size. A wrapped subtraction
# there is a `usize::MAX` allocation and no message, and the 134 casts clippy's pedantic group
# flags across this workspace are all deliberate, so gating them at compile time would cost 134
# `#[allow]`s to catch nothing.
#
# This costs a branch per arithmetic op and buys a clean abort instead. The architecture is already
# built to absorb one: release is `panic = "abort"` and `supervisor/src/generation.rs`'s
# `classify_departure` reads the signal, logs it, and restarts behind the crash-loop brake
# (ADR-0058 decision 3). Cheaper than being wrong quietly.
overflow-checks = true

# Dependencies at full optimization in a dev build; this workspace's own crates stay at `dev`'s
# `opt-level = 0`, so debugging and incremental rebuilds are unaffected.
#
# The Renderer's per-frame cost is mostly other people's tight pixel loops. Rasterizing a glyph
# through femtovg/swash, decoding a JPEG through `image`, rasterizing an SVG through `resvg`: none
# of it is workspace code, and all of it is exactly what `opt-level = 0` punishes hardest. Measured
# on the first paint of the panel host, which rasterizes every glyph it shows into femtovg's atlas:
# 272.8ms of text drawing unoptimized against 6.2ms optimized, and a 5162x2160 wallpaper 9636ms
# against 114ms. A dev build was dropping frames that release never would, which turns every
# animation judgement made against it into a guess.
#
# Dependencies rebuild only when one changes, so this is paid once rather than per edit.
[profile.dev.package."*"]
opt-level = 3
