[workspace]
members = ["shared", "supervisor", "renderer"]
resolver = "2"

# One version for the three crates. They ship together, the Supervisor spawns the Renderer as a
# sibling binary, and `shared` is only ever consumed by those two, so three numbers could differ
# only by mistake. It is also the number `oblisk --version` prints, the one `oblisk.version` hands
# a config (§ 2), and the one stamped into the generated language-server stubs, and those three
# disagreeing is exactly the failure worth designing out.
#
# Versioning tracks the Lua API, because that is the only public interface this has. Minor for an
# IDL field added or changed, patch for everything else. A config gates on it with
# `oblisk.version.minor >= n`.
#
# Not in force yet, which is why IDL changes keep landing against 0.1.0 (docs/adr/0069's `scroll`,
# docs/adr/0078's `exclusive`). Nothing has been pushed to origin, so this number informs nobody and
# 0.1.0 is a placeholder. The first push starts it; until then, do not bump, and do not re-litigate
# the gap between this comment and the log every time an IDL field moves.
[workspace.package]
version = "0.1.0"
edition = "2024"

# Every `unsafe` block in this workspace is a real one -- a C API (EGL, GL, fontdb's mmap) or the
# one process-wide `set_var` in `main`. `undocumented_unsafe_blocks` makes the SAFETY comment a
# build requirement rather than a convention, because the convention had already drifted: two
# comments claimed no other test touched the variable they were setting while another test set it,
# which is how a `just check` failed on a race that had been latent for weeks.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
