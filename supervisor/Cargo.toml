[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
enumflags2 = "0.7.12"
futures-util = "0.3.34"
hound = "3.5.1"
inotify = "0.11.5"
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
nonstick = "0.1.2"
pipewire = "0.10.1"
png = "0.18.1"
regex = "1.13.1"
rusty_network_manager = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
smithay-client-toolkit = "0.21.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
udev = "0.9.3"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5.19.0", features = ["tokio"] }
zbus_polkit = { version = "5.0.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
zbus = { version = "5.19.0", features = ["tokio", "p2p"] }
