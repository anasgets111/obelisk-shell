[package]
name = "supervisor"
version.workspace = true
edition.workspace = true

# The installed name. The crate stays `supervisor`, which is what `-p supervisor` and every module
# path in the tree already say; this is only what lands in `$PREFIX/lib/oblisk`.
[[bin]]
name = "oblisk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alpm = "5.0.2"
enumflags2 = "0.7.12"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
hound = "3.5.1"
inotify = "0.11.5"
niri-ipc = "26.4.0"
nix = { version = "0.31.3", features = ["process", "signal", "time", "user"] }
nonstick = "0.1.2"
pipewire = "0.10.1"
png = "0.18.1"
regex = "1.13.1"
rusty_network_manager = "0.7.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
smithay-client-toolkit = "0.21.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
udev = { version = "0.9.3", features = ["send"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5.19.0", features = ["tokio"] }
zbus_polkit = { version = "5.0.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus = { version = "5.19.0", features = ["tokio", "p2p"] }
