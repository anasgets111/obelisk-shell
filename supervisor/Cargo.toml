[package]
name = "supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The installed name. The crate stays `supervisor`, which is what `-p supervisor` and every module
# path in the tree already say; this is only what lands in `$PREFIX/lib/obelisk`.
[[bin]]
name = "obelisk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alpm = "5.0.2"
enumflags2 = "0.7.12"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
hound = "3.5.1"
inotify = "0.11.5"
# One `malloc_trim` call after the update check (`memory.rs`). Already in the tree through `nix`.
libc.workspace = true
niri-ipc = "26.4.0"
nix = { workspace = true, features = ["process", "signal", "time", "user"] }
nonstick = "0.1.2"
pipewire = "0.10.1"
png.workspace = true
regex-lite = "0.1.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shared.workspace = true
tempfile.workspace = true
# `full` minus `fs` and `parking_lot`, which nothing here uses.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "io-std"] }
tokio-stream = "0.1.19"
udev = { version = "0.9.3", features = ["send"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
# No defaults: they add an async-io executor beside tokio.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# 5.1.0 is the floor, not a preference: RUSTSEC-2026-0278 is an authorization bypass through PID
# reuse in 5.0.0 (7.3 high), and `polkit.rs` registers this session's authentication agent, so
# the bypass would be in the path that decides whether the user authenticated.
zbus_polkit = { version = "5.1.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The JsonSchema derives exist only for the test-only stub generator (`stubs.rs`).
schemars = "1.2.2"
# Only `test-util`, so tests build the tokio that ships. It is what `start_paused = true` needs:
# `battery::controller`'s loop is on a 30s timer, so testing it in real time is not testing it.
tokio = { workspace = true, features = ["test-util"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }
