[package]
name = "supervisor"
version.workspace = true
edition.workspace = true

# The installed name. The crate stays `supervisor`, which is what `-p supervisor` and every module
# path in the tree already say; this is only what lands in `$PREFIX/lib/obelisk`.
[[bin]]
name = "obelisk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alpm = "5.0.2"
enumflags2 = "0.7.12"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3.34"
hound = "3.5.1"
inotify = "0.11.5"
# One `malloc_trim` call after the update check (`memory.rs`). Already in the tree through `nix`.
libc = "0.2"
niri-ipc = "26.4.0"
nix = { version = "0.31.3", features = ["process", "signal", "time", "user"] }
nonstick = "0.1.2"
pipewire = "0.10.1"
png = "0.18.1"
regex = "1.13.1"
rusty_network_manager = "0.7.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared = { version = "0.1.0", path = "../shared" }
tempfile = "3.27.0"
# `full` minus `fs` and `parking_lot`, which nothing here uses.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "io-std"] }
tokio-stream = "0.1.19"
udev = { version = "0.9.3", features = ["send"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# No defaults: they add an async-io executor beside tokio. `rusty_network_manager` still turns them
# back on until its proxies are replaced.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# 5.1.0 is the floor, not a preference: RUSTSEC-2026-0278 is an authorization bypass through PID
# reuse in 5.0.0 (7.3 high), and `polkit.rs` registers this session's authentication agent, so
# the bypass would be in the path that decides whether the user authenticated.
zbus_polkit = { version = "5.1.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# `test-util` is not in tokio's `full`, and it is what `#[tokio::test(start_paused = true)]` needs.
# `battery::controller`'s loop is on a 30s timer, so testing it in real time is not testing it.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }
